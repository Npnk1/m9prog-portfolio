# Lokale ontwikkelomgeving: WordPress + MySQL + phpMyAdmin + WP-CLI.
# Wachtwoorden staan NIET in dit bestand maar in .env (zie .env.example).
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Maak eerst een .env aan, zie README}
      MYSQL_USER: ${DB_USER:?Maak eerst een .env aan, zie README}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Maak eerst een .env aan, zie README}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Maak eerst een .env aan, zie README}
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/dump            # hier komt de database-dump terecht

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/np-portfolio:/var/www/html/wp-content/themes/np-portfolio

  # Alleen voor commando's: docker compose run --rm wpcli wp <commando>
  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"                   # zelfde gebruiker als de WordPress-container
    profiles: ["tools"]
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/np-portfolio:/var/www/html/wp-content/themes/np-portfolio
      - ./seed:/seed:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db

volumes:
  db_data:
  wp_data:
